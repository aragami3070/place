services:
  api:
    restart: always
    build: .
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    depends_on:
      - "db"
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      DATABASE: "mongodb://db/place"
      PORT: "${PORT:-3000}"
      ONLY_LISTEN_LOCAL: "false"
    volumes:
      - place-data:/usr/src/app/.place-data
  db:
    # mongoose 4 несовместим с современными версиями MongoDB
    image: mongo:4.4
    restart: always
    volumes:
      - mongo-volume:/data/db
    expose:
      - "27017"
volumes:
  mongo-volume:
  place-data:
